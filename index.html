<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Telegram Verification</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #17212b;
    }

    .container {
        width: 100%;
        max-width: 420px;
        background: white;
        border-radius: 24px;
        padding: 30px 22px;
        text-align: center;
        box-shadow: 0 10px 35px rgba(0,0,0,.10);
    }

    .logo {
        width: 90px;
        height: 90px;
        margin: 0 auto 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #229ed9;
        color: white;
        font-size: 42px;
    }

    h1 {
        font-size: 25px;
        margin-bottom: 10px;
    }

    .description {
        color: #687684;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    .verify-btn {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 15px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        background: #229ed9;
        color: white;
    }

    .verify-btn:disabled {
        opacity: .6;
        cursor: not-allowed;
    }

    .status {
        display: none;
        margin-top: 22px;
        padding: 18px;
        border-radius: 15px;
        line-height: 1.6;
    }

    .loading {
        display: block;
        background: #eef7fc;
        color: #1877a8;
    }

    .success {
        display: block;
        background: #edf9f0;
        color: #218838;
    }

    .error {
        display: block;
        background: #fff0f0;
        color: #d93025;
    }

    .icon {
        font-size: 38px;
        margin-bottom: 8px;
    }

</style>

</head><body><div class="container"><div class="logo">
    ✓
</div>

<h1>Telegram Verification</h1>

<p class="description">
    Verify your Telegram account securely.
</p>

<button
    id="verifyBtn"
    class="verify-btn"
    onclick="startVerification()"
>
    🔐 Verify Account
</button>

<div
    id="status"
    class="status"
></div>

</div><script>

const tg = window.Telegram?.WebApp;

const verifyBtn =
    document.getElementById("verifyBtn");

const statusBox =
    document.getElementById("status");


/* ==========================================
   TELEGRAM INIT
========================================== */

if (tg) {

    tg.ready();

    tg.expand();

}


/* ==========================================
   STATUS MESSAGE
========================================== */

function showStatus(
    type,
    icon,
    title,
    message
) {

    statusBox.className =
        "status " + type;

    statusBox.innerHTML = `
        <div class="icon">${icon}</div>
        <strong>${title}</strong>
        <div>${message}</div>
    `;

}


/* ==========================================
   START VERIFICATION
========================================== */

async function startVerification() {

    verifyBtn.disabled = true;

    verifyBtn.innerText =
        "⏳ Verifying...";


    /* ==========================================
       CHECK TELEGRAM
    ========================================== */

    if (!tg) {

        showStatus(
            "error",
            "❌",
            "Telegram Required",
            "Open this page inside Telegram."
        );

        verifyBtn.disabled = false;

        verifyBtn.innerText =
            "🔐 Verify Account";

        return;
    }


    /* ==========================================
       GET TELEGRAM INIT DATA
    ========================================== */

    const initData =
        tg.initData;


    if (!initData) {

        showStatus(
            "error",
            "❌",
            "Verification Failed",
            "Telegram verification data is missing."
        );

        verifyBtn.disabled = false;

        verifyBtn.innerText =
            "🔐 Try Again";

        return;
    }


    /* ==========================================
       SEND TO FLASK
    ========================================== */

    try {

        const response = await fetch(
            "/api/verify",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    initData: initData

                })
            }
        );


        /* ==========================================
           READ SERVER RESPONSE
        ========================================== */

        const result =
            await response.json();


        /* ==========================================
           VERIFICATION FAILED
        ========================================== */

        if (
            !response.ok ||
            result.status !== "PASS"
        ) {

            showStatus(
                "error",
                "❌",
                "Verification Failed",
                result.message ||
                "Verification failed."
            );

            verifyBtn.disabled = false;

            verifyBtn.innerText =
                "🔐 Try Again";

            return;
        }


        /* ==========================================
           VERIFICATION PASS
        ========================================== */

        if (
            result.status === "PASS" &&
            result.verified === true
        ) {

            showStatus(
                "success",
                "✅",
                "Verification Successful!",
                "Your Telegram account has been verified successfully."
            );

            verifyBtn.style.display =
                "none";


            /* ==========================================
               CLOSE MINI APP
            ========================================== */

            setTimeout(() => {

                try {

                    tg.close();

                } catch (error) {

                    console.log(
                        "Telegram close error:",
                        error
                    );

                }

            }, 1500);

        }

    }


    /* ==========================================
       CONNECTION ERROR
    ========================================== */

    catch (error) {

        console.error(
            "Verification error:",
            error
        );

        showStatus(
            "error",
            "⚠️",
            "Connection Error",
            "Could not connect to the verification server."
        );

        verifyBtn.disabled = false;

        verifyBtn.innerText =
            "🔐 Try Again";

    }

}

</script></body></html>
