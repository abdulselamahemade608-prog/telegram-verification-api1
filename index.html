<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<title>Verification</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    font-family:
        Arial,
        sans-serif;

    background:
        #1f2d3d;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

}

.container {

    width: 100%;

    max-width: 440px;

    background:
        #111c27;

    border-radius: 28px;

    padding:
        42px 22px 30px;

    text-align: center;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.25);

}

.logo {

    width: 90px;

    height: 90px;

    border-radius: 50%;

    background:
        #eef6ff;

    display: flex;

    align-items: center;

    justify-content: center;

    margin:
        0 auto 25px;

    font-size: 45px;

}

h1 {

    color: white;

    font-size: 36px;

    margin-bottom: 15px;

}

.subtitle {

    color: #7d8999;

    font-size: 19px;

    line-height: 1.6;

    margin-bottom: 28px;

}

.user-card {

    background:
        #1b2733;

    border-radius: 20px;

    padding: 20px;

    margin-bottom: 25px;

    color: white;

}

.user-name {

    font-size: 23px;

    font-weight: bold;

    margin-bottom: 8px;

}

.username {

    font-size: 18px;

    color: #e5e7eb;

}

.verify-btn {

    width: 100%;

    border: none;

    border-radius: 18px;

    padding: 18px;

    background:
        #229ed9;

    color: white;

    font-size: 22px;

    font-weight: bold;

    cursor: pointer;

}

.verify-btn:disabled {

    opacity: 0.65;

    cursor: default;

}

.status {

    display: none;

    margin-top: 22px;

    padding: 18px;

    border-radius: 18px;

    font-size: 18px;

    line-height: 1.5;

}

.loading {

    display: block;

    background: #25313d;

    color: #d0d5dd;

}

.success {

    display: block;

    background: #063b2a;

    color: #6ce9a6;

}

.error {

    display: block;

    background: #421d20;

    color: #ffb4b4;

}

</style>

</head>


<body>


<div class="container">


    <div class="logo">
        🔐
    </div>


    <h1>
        Verification
    </h1>


    <p class="subtitle">
        Complete the verification below to continue.
    </p>


    <div
        class="user-card"
        id="userInfo"
    >

        Loading Telegram account...

    </div>


    <button
        class="verify-btn"
        id="verifyBtn"
        onclick="verifyAccount()"
    >

        ✅ Verify Now

    </button>


    <div
        class="status"
        id="status"
    ></div>


</div>


<script>


const tg =
    window.Telegram.WebApp;


tg.ready();

tg.expand();


const user =
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user;


const userInfo =
    document.getElementById(
        "userInfo"
    );


const verifyBtn =
    document.getElementById(
        "verifyBtn"
    );


const statusBox =
    document.getElementById(
        "status"
    );


// ==========================================
// SHOW TELEGRAM USER
// ==========================================

if (user) {

    const firstName =
        user.first_name ||
        "User";

    const username =
        user.username
        ? "@" + user.username
        : "No username";

    userInfo.innerHTML =

        "<div class='user-name'>👤 "
        + escapeHTML(firstName)
        + "</div>"

        +

        "<div class='username'>"
        + escapeHTML(username)
        + "</div>";

} else {

    userInfo.innerHTML =
        "⚠️ Open this Mini App from Telegram.";

}


// ==========================================
// VERIFY ACCOUNT
// ==========================================

async function verifyAccount() {


    // --------------------------------------
    // Check Telegram initData
    // --------------------------------------

    if (!tg.initData) {

        showStatus(
            "❌ Telegram verification data was not found.",
            "error"
        );

        return;
    }


    // --------------------------------------
    // Loading
    // --------------------------------------

    verifyBtn.disabled = true;

    verifyBtn.innerText =
        "⏳ Verifying...";


    showStatus(
        "🔍 Verifying your Telegram account...",
        "loading"
    );


    try {


        // ----------------------------------
        // Send data to Vercel
        // ----------------------------------

        const response =
            await fetch(
                "/api/verify",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            initData:
                                tg.initData

                        })

                }
            );


        // ----------------------------------
        // Read response
        // ----------------------------------

        const data =
            await response.json();


        // ----------------------------------
        // PASS
        // ----------------------------------

        if (
            response.ok &&
            data.success === true &&
            data.status === "PASS"
        ) {


            showStatus(
                "✅ Verification successful!",
                "success"
            );


            verifyBtn.innerText =
                "✅ Verified";


            // --------------------------------
            // Send PASS to Telegram
            // --------------------------------

            try {

                tg.sendData(
                    JSON.stringify({

                        status:
                            "PASS",

                        user_id:
                            user?.id || null

                    })
                );

            } catch (e) {

                console.log(
                    "sendData:",
                    e
                );

            }


        }

        // ----------------------------------
        // FAIL
        // ----------------------------------

        else {


            showStatus(

                "❌ Verification failed.\n\n"
                +
                (
                    data.message ||
                    "Please try again."
                ),

                "error"

            );


            verifyBtn.disabled =
                false;

            verifyBtn.innerText =
                "🔄 Try Again";

        }


    }

    catch (error) {


        console.error(
            "Verification error:",
            error
        );


        showStatus(

            "⚠️ Connection error.\n"
            +
            "Please try again.",

            "error"

        );


        verifyBtn.disabled =
            false;

        verifyBtn.innerText =
            "🔄 Try Again";

    }

}


// ==========================================
// STATUS
// ==========================================

function showStatus(
    text,
    type
) {

    statusBox.innerText =
        text;

    statusBox.className =
        "status " + type;

}


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>


</body>

</html>
